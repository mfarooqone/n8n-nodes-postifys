# Publishes n8n-nodes-postifys with npm provenance (required for n8n Creator Portal verification).
# Setup once: GitHub repo Settings → Secrets → Actions → NPM_TOKEN (npm access token with publish).
# Then: git tag v0.6.21 && git push origin v0.6.21
# Or run this workflow manually from the Actions tab.

name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance / OIDC
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Publish with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
